<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Coloring Book — MEDACO Games</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root,[data-theme=light]{
  --bg:#fff8f0;--s:#fff;--s2:#fff0e0;--bd:#fcd5a0;
  --tx:#2d1800;--mu:#8a5a2a;--pr:#e67e22;--ph:#d35400;
  --fn:'Nunito',sans-serif;--fb:'Inter',sans-serif;
  --sh:0 2px 12px rgba(200,100,0,.1);--sh2:0 8px 28px rgba(200,100,0,.18);
}
[data-theme=dark]{
  --bg:#1a0e00;--s:#2a1800;--s2:#351f00;--bd:#6b3a00;
  --tx:#fde8c0;--mu:#c8923a;--pr:#f39c12;--ph:#e67e22;
  --sh:0 2px 12px rgba(0,0,0,.35);--sh2:0 8px 28px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:var(--fb);background:var(--bg);color:var(--tx);min-height:100dvh}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font:inherit;touch-action:manipulation}
button{border:none;cursor:pointer}

/* NAV */
nav{position:sticky;top:0;z-index:20;background:var(--s);border-bottom:2px solid var(--bd);box-shadow:var(--sh)}
.ni{max-width:1200px;margin:0 auto;padding:0 16px;height:62px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{color:var(--pr);font-family:var(--fn);font-weight:800;font-size:.9rem}.back:hover{text-decoration:underline}
.brand{font-family:var(--fn);font-weight:900}
.nav-r{display:flex;gap:8px;align-items:center}
.snd-btn{padding:8px 14px;border-radius:8px;font-family:var(--fn);font-weight:800;font-size:.82rem;background:#27ae60;color:#fff}
.snd-btn.off{background:#95a5a6}
.adm-btn{padding:8px 14px;border-radius:8px;font-family:var(--fn);font-weight:800;font-size:.82rem;background:#34495e;color:#fff}
.tt{width:38px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--mu);background:none;border:none}
.tt:hover{background:var(--s2)}

/* WRAP */
.wrap{max-width:1200px;margin:0 auto;padding:20px 14px 56px}
.ptitle{text-align:center;margin-bottom:18px}
.ptitle h1{font-family:var(--fn);font-weight:900;font-size:clamp(1.5rem,4vw,2.1rem);margin:0 0 6px}
.ptitle p{margin:0;color:var(--mu);font-size:.9rem}

/* ADMIN PANEL */
.admin-panel{display:none;background:var(--s2);border:2px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:20px;box-shadow:var(--sh)}
.admin-panel h3{font-family:var(--fn);font-weight:900;font-size:1.05rem;margin:0 0 14px}
.admin-inner{background:var(--s);padding:16px;border-radius:10px;margin-bottom:14px}
.admin-inner h4{font-family:var(--fn);font-weight:800;font-size:.9rem;margin:0 0 12px}
.ap-label{display:block;font-weight:700;font-size:.82rem;color:var(--mu);margin-bottom:5px}
.ap-input{width:100%;padding:9px 12px;border:1.5px solid var(--bd);border-radius:8px;background:var(--s);color:var(--tx);font-size:.86rem;margin-bottom:10px}
.ap-input:focus{outline:none;border-color:var(--pr)}
.ap-preview{width:100%;height:160px;border:2px dashed var(--bd);border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--s2);overflow:hidden;margin-bottom:10px;font-size:.82rem;color:var(--mu)}
.btn{padding:10px 16px;border-radius:9px;font-family:var(--fn);font-weight:800;font-size:.85rem;color:#fff;transition:transform .13s,opacity .13s}
.btn:hover{transform:translateY(-1px);opacity:.9}
.btn-add{background:#27ae60;width:100%}.btn-del-all{background:#e74c3c;margin-top:10px}
.btn-close-admin{background:#95a5a6;margin-top:8px}
.pages-admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-height:300px;overflow-y:auto}
.admin-page-card{border:1.5px solid var(--bd);border-radius:8px;padding:10px;background:var(--bg)}
.apc-img{width:100%;height:80px;object-fit:contain;border-radius:6px;margin-bottom:6px;background:var(--s2)}
.apc-name{font-family:var(--fn);font-weight:800;font-size:.82rem;margin-bottom:3px}
.apc-diff{font-size:.74rem;font-weight:700;margin-bottom:5px}
.btn-del-page{width:100%;padding:5px;background:#e74c3c;color:#fff;border-radius:5px;font-size:.76rem;font-weight:700}

/* GALLERY */
.filter-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.filter-btn{padding:9px 20px;border-radius:8px;font-family:var(--fn);font-weight:800;font-size:.85rem;background:#95a5a6;color:#fff;transition:background .15s}
.filter-btn.active{background:var(--pr)}
.gallery{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.puzzle-card{border:2.5px solid;border-radius:14px;padding:14px;background:var(--s);cursor:pointer;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s}
.puzzle-card:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.puzzle-card img{width:100%;height:150px;object-fit:contain;border-radius:8px;background:var(--s2);margin-bottom:10px}
.puzzle-card .pc-no-img{width:100%;height:150px;background:var(--s2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:2rem;margin-bottom:10px}
.puzzle-card h4{font-family:var(--fn);font-weight:900;font-size:.95rem;margin:0 0 5px}
.puzzle-card .pc-meta{display:flex;justify-content:space-between;font-size:.78rem;font-weight:700}

/* COLORING SCREEN */
#coloring-screen{display:none}
.col-header{display:flex;gap:10px;margin-bottom:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.col-header h3{font-family:var(--fn);font-weight:900;font-size:1rem;margin:0;flex:1;min-width:140px}
.col-btns{display:flex;gap:7px;flex-wrap:wrap}
.btn-undo{background:#9b59b6}.btn-clear{background:#e74c3c}.btn-save{background:#27ae60}.btn-back{background:#95a5a6}
.prog-wrap{background:var(--s2);border-radius:8px;height:26px;overflow:hidden;position:relative;border:1.5px solid var(--bd);margin-bottom:14px}
.prog-fill{height:100%;width:0%;background:linear-gradient(90deg,#e67e22,#f39c12);transition:width .35s}
.prog-text{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--fn);font-weight:900;font-size:.8rem;color:var(--tx);white-space:nowrap}

/* COLORING LAYOUT */
.col-layout{display:flex;flex-direction:column;gap:14px}
@media(min-width:768px){.col-layout{display:grid;grid-template-columns:270px 1fr}}

/* TOOLBAR */
.toolbar{background:var(--s);border:2px solid var(--bd);border-radius:12px;padding:16px;box-shadow:var(--sh)}
.toolbar h4{font-family:var(--fn);font-weight:900;font-size:.88rem;margin:0 0 12px}
.tool-row{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.tool-btn{flex:1;min-width:72px;padding:10px 6px;border-radius:8px;font-family:var(--fn);font-weight:800;font-size:.82rem;color:#fff;background:#95a5a6;text-align:center}
.tool-btn.active{background:var(--pr)}
.tb-label{display:block;font-weight:700;font-size:.8rem;color:var(--mu);margin-bottom:5px}
.brush-range{width:100%;height:8px;margin-bottom:14px;accent-color:var(--pr)}
.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:10px}
.swatch{width:100%;aspect-ratio:1;border-radius:6px;cursor:pointer;border:3px solid transparent;transition:transform .12s,border-color .12s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.swatch:hover{transform:scale(1.15)}
.swatch.active{border-color:#2c3e50;transform:scale(1.15)}
.custom-color-wrap{display:flex;flex-direction:column;gap:4px}
#custom-color{width:100%;height:38px;border:2px solid var(--bd);border-radius:8px;cursor:pointer;padding:2px}
.custom-lbl{font-size:.74rem;color:var(--mu);text-align:center}

/* CANVAS AREA */
.canvas-area{border:3px solid var(--bd);border-radius:12px;overflow:auto;background:var(--s2);box-shadow:var(--sh2)}
#coloring-canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair;max-width:100%}

/* MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.87);z-index:50;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal-box{background:var(--s);padding:32px 22px;border-radius:18px;text-align:center;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.mod-emoji{font-size:64px}.mod-title{font-family:var(--fn);font-weight:900;font-size:1.6rem;color:#e67e22;margin:10px 0 4px}
.mod-stars{font-size:38px;margin:8px 0}.mod-pct{font-size:.95rem;color:var(--mu);margin-bottom:18px}
.mod-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mod-btns button{padding:12px 20px;border-radius:10px;color:#fff;font-family:var(--fn);font-weight:900;font-size:.88rem;border:none;cursor:pointer}

.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>

<nav>
  <div class="ni">
    <a class="back" href="../../index.html">← All Games</a>
    <span class="brand">🎨 Coloring Book</span>
    <div class="nav-r">
      <button class="snd-btn" id="snd-btn" onclick="toggleSound()">🔊 Sound: ON</button>
      <button class="adm-btn" onclick="toggleAdmin()">⚙️ Manage Images</button>
      <button class="tt" data-theme-toggle aria-label="Toggle dark mode">◐</button>
    </div>
  </div>
</nav>

<div class="wrap">

  <!-- ADMIN PANEL -->
  <div class="admin-panel" id="admin-panel">
    <h3>🎨 Coloring Page Management</h3>
    <div class="admin-inner">
      <h4>Upload New Coloring Page</h4>
      <label class="ap-label">Page Title</label>
      <input class="ap-input" type="text" id="inp-title" placeholder="e.g., Butterfly Garden">
      <label class="ap-label">Difficulty</label>
      <select class="ap-input" id="inp-diff">
        <option value="easy">🟢 Easy — Simple shapes, large areas</option>
        <option value="medium">🟡 Medium — Moderate detail</option>
        <option value="hard">🔴 Hard — Complex patterns</option>
      </select>
      <label class="ap-label">Image File</label>
      <input class="ap-input" type="file" id="inp-image" accept="image/*" onchange="previewUpload(event)">
      <div class="ap-preview" id="ap-preview">Preview will appear here</div>
      <button class="btn btn-add" onclick="addPage()">➕ Add Coloring Page</button>
    </div>
    <div class="admin-inner">
      <h4>Available Pages (<span id="page-count">0</span>)</h4>
      <div class="pages-admin-grid" id="admin-pages-grid"></div>
      <button class="btn btn-del-all" style="width:100%" onclick="deleteAllCustom()">🗑️ Delete All Custom Pages</button>
    </div>
    <button class="btn btn-close-admin" style="width:100%" onclick="toggleAdmin()">Close</button>
  </div>

  <!-- TITLE -->
  <div class="ptitle">
    <h1>🎨 Coloring Book</h1>
    <p>Choose a coloring page and bring it to life!</p>
  </div>

  <!-- GALLERY -->
  <div id="level-screen">
    <div class="filter-row">
      <button class="filter-btn active" id="filter-all" onclick="setFilter('all')">All</button>
      <button class="filter-btn" id="filter-easy" onclick="setFilter('easy')">🟢 Easy</button>
      <button class="filter-btn" id="filter-medium" onclick="setFilter('medium')">🟡 Medium</button>
      <button class="filter-btn" id="filter-hard" onclick="setFilter('hard')">🔴 Hard</button>
    </div>
    <div class="gallery" id="gallery"></div>
  </div>

  <!-- COLORING SCREEN -->
  <div id="coloring-screen">
    <div class="col-header">
      <h3 id="col-title">Page Title</h3>
      <div class="col-btns">
        <button class="btn btn-undo" id="undo-btn" onclick="undo()">↶ Undo</button>
        <button class="btn btn-clear" onclick="clearCanvas()">🗑️ Clear</button>
        <button class="btn btn-save" onclick="saveColoring()">💾 Save</button>
        <button class="btn btn-back" onclick="backToGallery()">← Back</button>
      </div>
    </div>
    <div class="prog-wrap"><div class="prog-fill" id="prog-fill"></div><span class="prog-text" id="prog-text">0% Coloured</span></div>
    <div class="col-layout">
      <!-- TOOLBAR -->
      <div class="toolbar">
        <h4>🛠️ Tools</h4>
        <div class="tool-row">
          <button class="tool-btn active" id="tool-brush" onclick="setTool('brush')">🖌️ Brush</button>
          <button class="tool-btn" id="tool-bucket" onclick="setTool('bucket')">🪣 Fill</button>
          <button class="tool-btn" id="tool-eraser" onclick="setTool('eraser')">✏️ Eraser</button>
        </div>
        <label class="tb-label">Brush Size: <span id="size-display">20</span>px</label>
        <input type="range" class="brush-range" id="brush-range" min="4" max="80" value="20">
        <label class="tb-label" style="margin-bottom:8px">Colours:</label>
        <div class="palette" id="palette"></div>
        <div class="custom-color-wrap">
          <input type="color" id="custom-color" value="#FF0000">
          <span class="custom-lbl">Custom colour</span>
        </div>
      </div>
      <!-- CANVAS -->
      <div class="canvas-area" id="canvas-area">
        <canvas id="coloring-canvas" aria-label="Coloring canvas"></canvas>
      </div>
    </div>
  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="mod-emoji">🎨</div>
    <div class="mod-title">Masterpiece!</div>
    <div class="mod-stars">⭐⭐⭐</div>
    <div class="mod-pct">You've coloured <strong id="modal-pct">0</strong>% of the page!</div>
    <div class="mod-btns">
      <button style="background:#3498db" onclick="closeModal()">Continue Colouring</button>
      <button style="background:#27ae60" onclick="backToGallery()">Choose New Page</button>
    </div>
  </div>
</div>

<div class="sr" aria-live="polite" id="live"></div>

<script>
(function(){
  /* ── DARK MODE ── */
  (function(){
    const t=document.querySelector('[data-theme-toggle]'),r=document.documentElement;
    let d=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
    r.setAttribute('data-theme',d);
    t&&t.addEventListener('click',()=>{d=d==='dark'?'light':'dark';r.setAttribute('data-theme',d);t.textContent=d==='dark'?'☀️':'◐'});
  })();

  /* ── SOUND ── */
  let actx=null,soundOn=true;
  function ac(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx}
  function tone(f,type,vol,dur,st){try{const a=ac(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type=type;o.frequency.value=f;const s=st||a.currentTime;g.gain.setValueAtTime(vol,s);g.gain.exponentialRampToValueAtTime(0.001,s+dur);o.start(s);o.stop(s+dur+.01)}catch(e){}}
  function sBrush(){if(!soundOn)return;tone(600+Math.random()*300,'sine',.04,.06)}
  function sBucket(){if(!soundOn)return;tone(400,'sine',.25,.05);tone(700,'sine',.15,.12,ac().currentTime+.06)}
  function sUndo(){if(!soundOn)return;tone(600,'triangle',.18,.1);tone(400,'triangle',.12,.15,ac().currentTime+.08)}
  function sClear(){if(!soundOn)return;[400,350,280,200].forEach((f,i)=>tone(f,'sawtooth',.1,.12,ac().currentTime+i*.07))}
  function sComplete(){if(!soundOn)return;[523,587,659,784,1047].forEach((f,i)=>tone(f,'triangle',.22,.38,ac().currentTime+i*.14))}
  function sClick(){if(!soundOn)return;tone(1000,'sine',.08,.05)}
  function sColor(){if(!soundOn)return;tone(800,'sine',.15,.08)}
  function say(t){document.getElementById('live').textContent=t}

  window.toggleSound=function(){
    soundOn=!soundOn;
    const b=document.getElementById('snd-btn');
    b.textContent=soundOn?'🔊 Sound: ON':'🔇 Sound: OFF';
    b.className=soundOn?'snd-btn':'snd-btn off';
    localStorage.setItem('cbSound',soundOn);if(soundOn)sClick();
  };
  const ss=localStorage.getItem('cbSound');
  if(ss!==null){soundOn=ss==='true';const b=document.getElementById('snd-btn');b.textContent=soundOn?'🔊 Sound: ON':'🔇 Sound: OFF';b.className=soundOn?'snd-btn':'snd-btn off'}

  /* ── DATA ── */
  const DEFAULTS=[
    {title:'Oak Team',difficulty:'medium',image:'https://site-lh8nd.powerappsportals.com/Team%20colouring.png',isDefault:true},
    {title:'Barnaby',difficulty:'medium',image:'https://site-lh8nd.powerappsportals.com/Barnaby%20trace.png',isDefault:true},
    {title:'Great Oak Team',difficulty:'medium',image:'https://site-lh8nd.powerappsportals.com/Great%20Oak%20team%20colouring.png',isDefault:true},
    {title:'Zara',difficulty:'medium',image:'https://site-lh8nd.powerappsportals.com/Zara%20trace.png',isDefault:true},
    {title:'Leo',difficulty:'easy',image:'https://site-lh8nd.powerappsportals.com/Leo%20tace.png',isDefault:true}
  ];
  const PALETTE=['#FF0000','#FF6B00','#FFD700','#00C853','#00BFFF','#3498DB','#8B00FF','#FF1493','#8B4513','#000000','#808080','#FFFFFF','#FFB6C1','#98FB98','#87CEEB','#DDA0DD'];
  const DIFF_COLORS={easy:'#27ae60',medium:'#f39c12',hard:'#e74c3c'};
  const DIFF_EMOJI={easy:'🟢',medium:'🟡',hard:'🔴'};

  let customPages=JSON.parse(localStorage.getItem('cbCustom')||'[]');
  function allPages(){return[...DEFAULTS,...customPages]}
  let currentFilter='all',currentPage=null;

  // drawing state
  let canvas=null,ctx2=null,isDrawing=false;
  let currentColor='#FF0000',brushSize=20,currentTool='brush';
  let undoStack=[],coloredPixels=new Set(),totalPixels=0;
  let modalShownAt=new Set();
  const MAX_UNDO=20;

  /* ── PALETTE ── */
  function buildPalette(){
    const p=document.getElementById('palette');
    p.innerHTML=PALETTE.map(c=>`<div class="swatch${c===currentColor?' active':''}" id="sw-${c.slice(1)}" style="background:${c}" onclick="selectColor('${c}')" title="${c}"></div>`).join('');
    document.getElementById('custom-color').addEventListener('change',e=>selectColor(e.target.value));
    document.getElementById('brush-range').addEventListener('input',e=>{brushSize=+e.target.value;document.getElementById('size-display').textContent=brushSize});
  }

  window.selectColor=function(c){
    sColor();currentColor=c;
    document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
    const sw=document.getElementById('sw-'+c.slice(1));if(sw)sw.classList.add('active');
  };

  /* ── ADMIN ── */
  window.toggleAdmin=function(){
    const p=document.getElementById('admin-panel');
    p.style.display=p.style.display==='none'?'block':'none';
    renderAdminGrid();sClick();
  };
  window.previewUpload=function(e){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=ev=>{document.getElementById('ap-preview').innerHTML=`<img src="${ev.target.result}" style="max-width:100%;max-height:160px;object-fit:contain">`};r.readAsDataURL(f);
  };
  window.addPage=function(){
    const title=document.getElementById('inp-title').value.trim();
    const diff=document.getElementById('inp-diff').value;
    const f=document.getElementById('inp-image').files[0];
    if(!title){alert('Enter a title.');return}if(!f){alert('Select an image.');return}
    const r=new FileReader();r.onload=e=>{
      customPages.push({title,difficulty:diff,image:e.target.result,isDefault:false});
      localStorage.setItem('cbCustom',JSON.stringify(customPages));
      document.getElementById('inp-title').value='';document.getElementById('inp-image').value='';
      document.getElementById('ap-preview').innerHTML='Preview will appear here';
      renderAdminGrid();renderGallery();sClick();alert('Coloring page added!');
    };r.readAsDataURL(f);
  };
  window.deletePage=function(i){
    const page=allPages()[i];if(page.isDefault){alert('Cannot delete default images.');return}
    if(!confirm('Delete this page?'))return;
    const ci=customPages.findIndex(p=>p.title===page.title&&p.image===page.image);
    if(ci!==-1){customPages.splice(ci,1);localStorage.setItem('cbCustom',JSON.stringify(customPages));renderAdminGrid();renderGallery();sClick()}
  };
  window.deleteAllCustom=function(){
    if(!confirm('Delete all custom pages?'))return;
    customPages=[];localStorage.setItem('cbCustom',JSON.stringify(customPages));renderAdminGrid();renderGallery();sClick();
  };
  function renderAdminGrid(){
    const pages=allPages();
    document.getElementById('page-count').textContent=pages.length;
    document.getElementById('admin-pages-grid').innerHTML=pages.map((p,i)=>`
      <div class="admin-page-card">
        ${p.image?`<img class="apc-img" src="${p.image}" alt="${p.title}" loading="lazy">`:'' }
        <div class="apc-name">${p.title}</div>
        <div class="apc-diff" style="color:${DIFF_COLORS[p.difficulty]}">${DIFF_EMOJI[p.difficulty]} ${p.difficulty}</div>
        ${p.isDefault?`<div style="font-size:.7rem;color:var(--mu);text-align:center">Permanent</div>`
          :`<button class="btn-del-page" onclick="deletePage(${i})">Delete</button>`}
      </div>`).join('');
  }

  /* ── GALLERY ── */
  window.setFilter=function(f){
    currentFilter=f;sClick();
    ['all','easy','medium','hard'].forEach(d=>{const b=document.getElementById('filter-'+d);b.className='filter-btn'+(d===f?' active':'')});
    renderGallery();
  };
  function renderGallery(){
    const g=document.getElementById('gallery');
    const pages=allPages();
    const list=currentFilter==='all'?pages:pages.filter(p=>p.difficulty===currentFilter);
    if(!list.length){g.innerHTML='<p style="text-align:center;color:var(--mu);padding:40px;grid-column:1/-1">No pages for this difficulty. Add one via ⚙️ Manage Images.</p>';return}
    g.innerHTML=list.map(p=>{
      const oi=pages.indexOf(p);
      return`<div class="puzzle-card" style="border-color:${DIFF_COLORS[p.difficulty]}" onclick="startColoring(${oi})">
        ${p.image?`<img src="${p.image}" alt="${p.title}" loading="lazy">`:`<div class="pc-no-img">🎨</div>`}
        <h4>${p.title}</h4>
        <div class="pc-meta">
          <span style="color:${DIFF_COLORS[p.difficulty]}">${DIFF_EMOJI[p.difficulty]} ${p.difficulty.charAt(0).toUpperCase()+p.difficulty.slice(1)}</span>
          <span style="color:var(--mu)">${p.completed||0}% done</span>
        </div>
      </div>`;
    }).join('');
  }

  /* ── START ── */
  window.startColoring=function(i){
    sClick();currentPage=allPages()[i];
    document.getElementById('level-screen').style.display='none';
    document.getElementById('coloring-screen').style.display='block';
    document.getElementById('modal').classList.remove('show');
    document.getElementById('col-title').textContent=currentPage.title;
    undoStack=[];coloredPixels.clear();modalShownAt.clear();
    updateUndoBtn();buildPalette();initCanvas();
  };

  /* ── CANVAS ── */
  function initCanvas(){
    canvas=document.getElementById('coloring-canvas');
    ctx2=canvas.getContext('2d');
    if(!currentPage.image)return;
    const img=new Image();img.crossOrigin='anonymous';
    img.onload=function(){
      canvas.width=img.width;canvas.height=img.height;
      ctx2.fillStyle='#ffffff';ctx2.fillRect(0,0,canvas.width,canvas.height);
      ctx2.drawImage(img,0,0);
      totalPixels=canvas.width*canvas.height;
      saveState();updateProgress();
    };
    img.onerror=function(){
      // fallback: blank white canvas with title
      canvas.width=800;canvas.height=600;
      ctx2.fillStyle='#fff';ctx2.fillRect(0,0,800,600);
      ctx2.strokeStyle='#ccc';ctx2.lineWidth=3;ctx2.strokeRect(10,10,780,580);
      ctx2.fillStyle='#bdc3c7';ctx2.font='bold 32px system-ui';ctx2.textAlign='center';ctx2.textBaseline='middle';
      ctx2.fillText('Image could not load',400,280);ctx2.font='20px system-ui';ctx2.fillText('Upload an image via ⚙️ Manage Images',400,330);
      totalPixels=canvas.width*canvas.height;saveState();
    };
    img.src=currentPage.image;
    attachCanvasEvents();
  }

  function attachCanvasEvents(){
    canvas.addEventListener('mousedown',mDown);
    canvas.addEventListener('mousemove',mMove);
    canvas.addEventListener('mouseup',mUp);
    canvas.addEventListener('mouseleave',mUp);
    canvas.addEventListener('touchstart',tStart,{passive:false});
    canvas.addEventListener('touchmove',tMove,{passive:false});
    canvas.addEventListener('touchend',tEnd,{passive:false});
  }

  /* ── TOOLS ── */
  window.setTool=function(t){
    sClick();currentTool=t;
    ['brush','bucket','eraser'].forEach(n=>{
      const b=document.getElementById('tool-'+n);
      b.classList.toggle('active',n===t);
    });
    if(canvas)canvas.style.cursor=t==='bucket'?'cell':t==='eraser'?'cell':'crosshair';
  };

  /* ── UNDO ── */
  function saveState(){
    if(!canvas)return;
    undoStack.push(ctx2.getImageData(0,0,canvas.width,canvas.height));
    if(undoStack.length>MAX_UNDO)undoStack.shift();
    updateUndoBtn();
  }
  window.undo=function(){
    if(!undoStack.length)return;sUndo();
    ctx2.putImageData(undoStack.pop(),0,0);updateUndoBtn();updateProgress();say('Undone');
  };
  function updateUndoBtn(){
    const b=document.getElementById('undo-btn');if(!b)return;
    b.disabled=undoStack.length===0;b.style.opacity=b.disabled?.5:1;
  }

  /* ── FLOOD FILL ── */
  function floodFill(sx,sy,fillHex){
    saveState();sBucket();
    const imgData=ctx2.getImageData(0,0,canvas.width,canvas.height),px=imgData.data;
    const ri=(sy*canvas.width+sx)*4;
    const tr=px[ri],tg=px[ri+1],tb=px[ri+2],ta=px[ri+3];
    const fr=parseInt(fillHex.slice(1,3),16),fg=parseInt(fillHex.slice(3,5),16),fb=parseInt(fillHex.slice(5,7),16);
    if(tr===fr&&tg===fg&&tb===fb&&ta===255)return;
    const stack=[sy*canvas.width+sx],visited=new Uint8Array(canvas.width*canvas.height);
    function match(i){return Math.abs(px[i]-tr)<=15&&Math.abs(px[i+1]-tg)<=15&&Math.abs(px[i+2]-tb)<=15&&Math.abs(px[i+3]-ta)<=15}
    function setpx(i){px[i]=fr;px[i+1]=fg;px[i+2]=fb;px[i+3]=255}
    while(stack.length){
      const pos=stack.pop();if(visited[pos])continue;
      const i4=pos*4;if(!match(i4))continue;
      visited[pos]=1;setpx(i4);
      const x=pos%canvas.width,y=Math.floor(pos/canvas.width);
      if(x>0)stack.push(pos-1);if(x<canvas.width-1)stack.push(pos+1);
      if(y>0)stack.push(pos-canvas.width);if(y<canvas.height-1)stack.push(pos+canvas.width);
    }
    ctx2.putImageData(imgData,0,0);updateProgress();
  }

  /* ── DRAWING ── */
  function getXY(clientX,clientY){
    const r=canvas.getBoundingClientRect();
    return{x:(clientX-r.left)*(canvas.width/r.width),y:(clientY-r.top)*(canvas.height/r.height)};
  }
  function startDraw(x,y){
    if(currentTool==='bucket'){floodFill(Math.floor(x),Math.floor(y),currentColor);return}
    isDrawing=true;saveState();ctx2.beginPath();ctx2.moveTo(x,y);drawAt(x,y);
  }
  function drawAt(x,y){
    if(!isDrawing)return;
    ctx2.lineWidth=brushSize;ctx2.lineCap='round';ctx2.lineJoin='round';
    ctx2.strokeStyle=currentTool==='eraser'?'#ffffff':currentColor;
    ctx2.lineTo(x,y);ctx2.stroke();ctx2.beginPath();ctx2.moveTo(x,y);
    coloredPixels.add(`${Math.floor(x)},${Math.floor(y)}`);
    sBrush();updateProgress();
  }
  function endDraw(){isDrawing=false;if(ctx2)ctx2.beginPath()}

  function mDown(e){const{x,y}=getXY(e.clientX,e.clientY);startDraw(x,y)}
  function mMove(e){if(!isDrawing)return;const{x,y}=getXY(e.clientX,e.clientY);drawAt(x,y)}
  function mUp(){endDraw()}
  function tStart(e){e.preventDefault();const t=e.touches[0];const{x,y}=getXY(t.clientX,t.clientY);startDraw(x,y)}
  function tMove(e){e.preventDefault();if(!isDrawing)return;const t=e.touches[0];const{x,y}=getXY(t.clientX,t.clientY);drawAt(x,y)}
  function tEnd(e){e.preventDefault();endDraw()}

  /* ── PROGRESS ── */
  function updateProgress(){
    // estimate: coloured pixels vs total non-white area (rough heuristic)
    const pct=Math.min(100,Math.round(coloredPixels.size/Math.max(1,totalPixels)*100*60));
    document.getElementById('prog-fill').style.width=pct+'%';
    document.getElementById('prog-text').textContent=pct+'% Coloured';
    if(currentPage)currentPage.completed=pct;
    // milestone celebration
    const milestones=[25,50,75,100];
    milestones.forEach(m=>{if(pct>=m&&!modalShownAt.has(m)){modalShownAt.add(m);if(m>=50){showModal(pct)}}});
  }

  function showModal(pct){
    sComplete();
    document.getElementById('modal-pct').textContent=pct;
    document.getElementById('modal').classList.add('show');
    say('Milestone reached: '+pct+'% coloured');
  }
  window.closeModal=function(){sClick();document.getElementById('modal').classList.remove('show')}

  /* ── CLEAR ── */
  window.clearCanvas=function(){
    if(!confirm('Clear all your colouring? This cannot be undone!'))return;
    sClear();
    const img=new Image();img.crossOrigin='anonymous';
    img.onload=function(){ctx2.fillStyle='#fff';ctx2.fillRect(0,0,canvas.width,canvas.height);ctx2.drawImage(img,0,0);coloredPixels.clear();undoStack=[];modalShownAt.clear();saveState();updateUndoBtn();updateProgress()};
    img.onerror=function(){ctx2.fillStyle='#fff';ctx2.fillRect(0,0,canvas.width,canvas.height);coloredPixels.clear();undoStack=[];saveState();updateProgress()};
    img.src=currentPage.image;
  };

  /* ── SAVE ── */
  window.saveColoring=function(){
    sClick();
    try{
      const url=canvas.toDataURL('image/png');
      const a=document.createElement('a');a.download=(currentPage.title||'coloring').replace(/\s+/g,'_')+'_colored.png';a.href=url;a.click();
      say('Image saved');
    }catch(e){alert('Could not save — image may be from a different origin.\n\n'+e.message)}
  };

  /* ── BACK ── */
  window.backToGallery=function(){
    sClick();
    document.getElementById('coloring-screen').style.display='none';
    document.getElementById('modal').classList.remove('show');
    document.getElementById('level-screen').style.display='block';
    renderGallery();
  };

  /* ── INIT ── */
  renderAdminGrid();renderGallery();buildPalette();
})();
</script>
</body>
</html>
