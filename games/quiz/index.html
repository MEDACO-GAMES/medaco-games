<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicine Quiz — MEDACO Games</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root,[data-theme=light]{
  --bg:#f0fff4;--s:#fff;--s2:#dcfce7;--bd:#bbf7d0;
  --tx:#14321e;--mu:#3d6b4f;--pr:#15803d;--ph:#166534;
  --ok:#15803d;--ok2:#dcfce7;--er:#be123c;--er2:#ffe4e6;
  --fn:'Nunito',sans-serif;--fb:'Inter',sans-serif;
  --sh:0 2px 8px rgba(0,80,40,.09);
}
[data-theme=dark]{
  --bg:#0a1f12;--s:#0f2b1a;--s2:#143521;--bd:#1a4d28;
  --tx:#d1fae5;--mu:#6ee7b7;--pr:#34d468;--ph:#4ade80;
  --ok:#34d468;--ok2:#14532d;--er:#fb7185;--er2:#4c0519;
  --sh:0 2px 8px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--fb);background:var(--bg);color:var(--tx);min-height:100dvh;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;font:inherit;border:none;background:none;}

nav{background:var(--s);border-bottom:2px solid var(--bd);padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--sh);}
.back{display:flex;align-items:center;gap:5px;color:var(--pr);font-weight:700;font-size:.9rem;font-family:var(--fn);}
.back:hover{text-decoration:underline;}
.nt{font-family:var(--fn);font-weight:800;font-size:1rem;}
.tt{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mu);}
.tt:hover{background:var(--s2);}

.wrap{max-width:580px;margin:0 auto;padding:26px 16px 56px;}

.prog-w{background:var(--s2);border-radius:999px;height:8px;margin-bottom:18px;overflow:hidden;}
.prog{height:100%;background:var(--pr);border-radius:999px;transition:width .4s ease;}

.toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.qcount{font-size:.8rem;color:var(--mu);font-weight:600;}
.score{font-family:var(--fn);font-size:.9rem;font-weight:800;color:var(--pr);}

.qcard{background:var(--s);border:1.5px solid var(--bd);border-radius:16px;padding:26px 22px;margin-bottom:14px;box-shadow:var(--sh);}
.qicon{font-size:2.4rem;text-align:center;margin-bottom:12px;}
.qcard h2{font-family:var(--fn);font-weight:800;font-size:1.12rem;line-height:1.45;}

.opts{display:grid;gap:10px;}
.ob{background:var(--s);border:2px solid var(--bd);border-radius:12px;padding:12px 18px;text-align:left;font-size:.91rem;font-weight:600;font-family:var(--fn);color:var(--tx);transition:background .14s,border-color .14s,transform .1s;}
.ob:hover:not(:disabled){border-color:var(--pr);background:var(--s2);transform:translateX(4px);}
.ob.cor{background:var(--ok2);border-color:var(--ok);color:var(--ok);}
.ob.wr{background:var(--er2);border-color:var(--er);color:var(--er);}
.ob:disabled{cursor:default;}

.fact{background:var(--s);border:1.5px solid var(--bd);border-radius:12px;padding:13px 17px;margin-top:12px;font-size:.85rem;line-height:1.65;color:var(--mu);display:none;}
.fact.show{display:block;}
.fact strong{color:var(--tx);}

.nxt{display:none;width:100%;margin-top:13px;padding:12px;border-radius:12px;font-family:var(--fn);font-weight:800;font-size:.95rem;background:var(--pr);color:#fff;border:none;transition:background .15s;}
.nxt.show{display:block;}
.nxt:hover{background:var(--ph);}

.res{text-align:center;padding:40px 14px;}
.res .big{font-size:3.8rem;margin-bottom:14px;}
.res h2{font-family:var(--fn);font-weight:900;font-size:1.65rem;margin-bottom:8px;}
.res p{color:var(--mu);line-height:1.6;}
.sbig{font-family:var(--fn);font-size:2.8rem;font-weight:900;color:var(--pr);margin-bottom:3px;margin-top:18px;}
.slab{font-size:.84rem;color:var(--mu);margin-bottom:24px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 28px;border-radius:12px;font-family:var(--fn);font-weight:800;font-size:.95rem;background:var(--pr);color:#fff;transition:background .15s;}
.btn:hover{background:var(--ph);}
</style>
</head>
<body>

<nav>
  <a href="../../index.html" class="back">&#8592; All Games</a>
  <span class="nt">&#129504; Medicine Quiz</span>
  <button class="tt" data-theme-toggle aria-label="Toggle dark mode">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</nav>

<div class="wrap" id="wrap"></div>

<script>
var QS = [
  {
    i:"&#127777;",
    q:"What is paracetamol most commonly used for?",
    o:["Lowering fever and relieving mild pain","Treating bacterial infections","Opening the airways in asthma","Reducing stomach acid"],
    a:0,
    f:"Paracetamol works by blocking pain signals in the brain. It is one of the most widely used medicines in the world and is safe for most children when given at the correct dose."
  },
  {
    i:"&#129473;",
    q:"Why are some medicines made as liquids for children?",
    o:["Liquids taste better than tablets","Children may find it hard to swallow tablets","Liquids always work faster","Liquids never need a prescription"],
    a:1,
    f:"Swallowing tablets can be difficult for young children. Liquid medicines are specially formulated so children get the right dose in a form they can take safely."
  },
  {
    i:"&#10052;",
    q:"Where should most liquid antibiotics be stored after opening?",
    o:["On a warm sunny windowsill","In the freezer","In the fridge","In a kitchen cupboard"],
    a:2,
    f:"Many liquid antibiotics must be kept in the fridge after being made up. Correct storage keeps them safe and effective for the full course of treatment."
  },
  {
    i:"&#9200;",
    q:"Why is it important to finish a full course of antibiotics?",
    o:["To use up the whole bottle","So all the bacteria are completely killed","Stopping early causes allergies","They taste bad at the end"],
    a:1,
    f:"Stopping antibiotics too early can leave some bacteria alive. Those remaining bacteria can become resistant and harder to treat with the same antibiotic in future."
  },
  {
    i:"&#127748;",
    q:"What does a blue reliever inhaler do?",
    o:["Prevents asthma attacks long-term","Quickly relaxes the muscles around the airways","Kills bacteria in the lungs","Reduces fever during asthma"],
    a:1,
    f:"Salbutamol, the blue reliever inhaler, acts within minutes by relaxing tight muscles around the airways, making it much easier to breathe during an asthma attack."
  },
  {
    i:"&#127852;",
    q:"Why do some children's medicines contain sweetener?",
    o:["To make them work faster","To disguise a bitter or unpleasant taste","Sweetener acts as a preservative","It is required by law"],
    a:1,
    f:"Many active medicine ingredients taste very bitter. Sugar-free versions also exist and are better for teeth. Always ask a pharmacist if you would prefer a sugar-free alternative."
  },
  {
    i:"&#128137;",
    q:"What does insulin do in the body?",
    o:["Kills viruses","Helps the body use sugar from food as energy","Stops pain signals","Reduces inflammation"],
    a:1,
    f:"Insulin allows cells to take up glucose from the blood. Children with type 1 diabetes need insulin injections because their bodies cannot produce enough insulin on their own."
  },
  {
    i:"&#129518;",
    q:"What is the safest way to measure a liquid medicine for a child?",
    o:["A kitchen teaspoon","A medicine syringe or measuring spoon","A large tablespoon","An eggcup"],
    a:1,
    f:"Kitchen teaspoons vary in size and can easily give the wrong dose. A medicine syringe provides an accurate measurement, which is especially important for small amounts."
  },
  {
    i:"&#9888;",
    q:"What should you do if you miss a dose of a regular medicine?",
    o:["Double the next dose to catch up","Check the medicine leaflet or ask a pharmacist","Skip the whole day's doses","Stop taking the medicine completely"],
    a:1,
    f:"For most medicines you should NOT double up on a missed dose. The safest advice varies between medicines, so always check the leaflet or speak to a pharmacist."
  },
  {
    i:"&#128300;",
    q:"How does ibuprofen differ from paracetamol?",
    o:["Ibuprofen is only suitable for adults","Ibuprofen also reduces inflammation, paracetamol does not","Paracetamol works faster than ibuprofen","They work in exactly the same way"],
    a:1,
    f:"Both relieve pain and fever, but ibuprofen is an anti-inflammatory so it also reduces swelling and redness. It is not suitable for everyone, so always check with a pharmacist first."
  }
];

var qi = 0, score = 0, answered = false, qs;

function shuffle(a) { return a.sort(function(){ return Math.random() - 0.5; }); }

qs = shuffle(QS.slice());

function render() {
  var w = document.getElementById("wrap");
  if (qi >= qs.length) { renderResult(w); return; }

  var q = qs[qi];
  var pct = Math.round((qi / qs.length) * 100);
  var isLast = qi === qs.length - 1;

  w.innerHTML =
    '<div class="prog-w"><div class="prog" id="prog" style="width:' + pct + '%"></div></div>' +
    '<div class="toprow">' +
      '<span class="qcount">Question ' + (qi + 1) + ' of ' + qs.length + '</span>' +
      '<span class="score">Score: ' + score + '</span>' +
    '</div>' +
    '<div class="qcard">' +
      '<div class="qicon">' + q.i + '</div>' +
      '<h2>' + q.q + '</h2>' +
    '</div>' +
    '<div class="opts" id="opts"></div>' +
    '<div class="fact" id="fact"><strong>&#128218; Did you know?</strong> ' + q.f + '</div>' +
    '<button class="nxt" id="nxt">' + (isLast ? 'See Results &#8594;' : 'Next Question &#8594;') + '</button>';

  var opts = document.getElementById("opts");
  q.o.forEach(function(o, i) {
    var b = document.createElement("button");
    b.className = "ob";
    b.textContent = o;
    b.addEventListener("click", function(){ answer(i, q.a); });
    opts.appendChild(b);
  });

  document.getElementById("nxt").addEventListener("click", function(){
    qi++;
    answered = false;
    render();
  });
}

function answer(chosen, correct) {
  if (answered) return;
  answered = true;
  var btns = document.querySelectorAll(".ob");
  btns.forEach(function(b){ b.disabled = true; });
  btns[correct].classList.add("cor");
  if (chosen !== correct) {
    btns[chosen].classList.add("wr");
  } else {
    score++;
  }
  document.getElementById("fact").classList.add("show");
  document.getElementById("nxt").classList.add("show");
}

function renderResult(w) {
  var pct = Math.round((score / qs.length) * 100);
  var em = "&#128218;", msg = "Keep learning — try again to improve!";
  if (pct >= 90) { em = "&#127942;"; msg = "Outstanding! You are a medicine expert!"; }
  else if (pct >= 70) { em = "&#127775;"; msg = "Great work! You know a lot about medicines."; }
  else if (pct >= 50) { em = "&#128077;"; msg = "Not bad at all — keep practising!"; }

  w.innerHTML =
    '<div class="res">' +
      '<div class="big">' + em + '</div>' +
      '<h2>' + msg + '</h2>' +
      '<div class="sbig">' + score + ' / ' + qs.length + '</div>' +
      '<div class="slab">' + pct + '% correct</div>' +
      '<p>You answered ' + score + ' out of ' + qs.length + ' questions correctly.</p>' +
      '<br>' +
      '<button class="btn" id="retry">&#128260; Play Again</button>' +
    '</div>';

  document.getElementById("retry").addEventListener("click", function(){
    qi = 0; score = 0; answered = false;
    qs = shuffle(QS.slice());
    render();
  });
}

(function(){
  var t = document.querySelector("[data-theme-toggle]"), r = document.documentElement;
  var d = matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light";
  r.setAttribute("data-theme", d);
  if (t) t.addEventListener("click", function(){
    d = d === "dark" ? "light" : "dark";
    r.setAttribute("data-theme", d);
  });
})();

render();
</script>
</body>
</html>
